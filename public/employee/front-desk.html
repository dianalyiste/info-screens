<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Front Desk</title>
    <link rel="stylesheet" href="/shared/auth-overlay.css">
    <link rel="stylesheet" href="/shared/buttons.css">
    <link rel="stylesheet" href="/shared/employee-layout.css">
    <link rel="stylesheet" href="/employee/front-desk.css">
</head>
<body>
    <div id="app-content" class="locked">
        <h1>Front Desk</h1>
        <div id="sessions-list"></div>
        <button id="add-session-btn" class="btn-primary">Add new session</button>
    </div>

    <div id="edit-overlay" style="display: none;">
        <div class="edit-box">
            <h2>Edit Driver</h2>

            <label for="edit-name">Driver name</label>
            <input type="text" id="edit-name">

            <label for="edit-car">Car number</label>
            <input type="number" id="edit-car" min="1" max="8">
            
            <p id="edit-error" class="error-text"></p>
            <div class="edit-actions">
                <button id="edit-save-btn" class="btn-primary">Save</button>
                <button id="edit-cancel-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="auth-overlay">
        <div class="login-box">
            <h2>Employee Access</h2>
            <p class="login-subtitle">Enter your access key to continue</p>
            <form>
                <input type="password" id="access-key" placeholder="Access key">
                <button type="submit" class="btn-primary">Unlock</button>
                <p id="auth-error" class="error-text"></p>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/socket-auth.js"></script>
    <script src="/employee/front-desk.js"></script>
    
</body>
</html>
