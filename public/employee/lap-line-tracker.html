<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Lap-line Tracker</title>
    <link rel="stylesheet" href="/shared/auth-overlay.css">
    <link rel="stylesheet" href="/shared/buttons.css">
    <link rel="stylesheet" href="/shared/employee-layout.css">
    <link rel="stylesheet" href="/employee/lap-line-tracker.css">
</head>
<body>
    <div id="app-content" class="locked">
        <h1>Lap-line Tracker</h1>

        <div id="timer"></div>
        <div id="race-status"></div>

        <div id="btn-cars">
            <button id="car-btn-1" class="btn-primary">#1</button>
            <button id="car-btn-2" class="btn-primary">#2</button>
            <button id="car-btn-3" class="btn-primary">#3</button>
            <button id="car-btn-4" class="btn-primary">#4</button>
            <button id="car-btn-5" class="btn-primary">#5</button>
            <button id="car-btn-6" class="btn-primary">#6</button>
            <button id="car-btn-7" class="btn-primary">#7</button>
            <button id="car-btn-8" class="btn-primary">#8</button>
        </div>
    </div>
    
    <div id="auth-overlay">
        <div class="login-box">
            <h2>Employee Access</h2>
            <p class="login-subtitle">Enter your access key to continue</p>
            <form>
                <input type="password" id="access-key" placeholder="Access key">
                <button type="submit" class="btn-primary">Unlock</button>
                <p id="auth-error" class="error-text"></p>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/socket-auth.js"></script>
    <script src="/shared/race-display.js"></script>
    <script src="/employee/lap-line-tracker.js"></script>
    
</body>
</html>
