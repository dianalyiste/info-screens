<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Control</title>
    <link rel="stylesheet" href="/shared/auth-overlay.css">
    <link rel="stylesheet" href="/shared/buttons.css">
    <link rel="stylesheet" href="/shared/employee-layout.css">
    <link rel="stylesheet" href="/employee/race-control.css">
</head>
<body>
    <div id="app-content" class="locked">
        <h1>Race Control</h1>

        <div id="timer"></div>
        <div id="race-status"></div>

        <div id="mode-controls">
            <div id="race-mode-buttons">
                <button id="mode-safe-btn" class="btn-success">Safe</button>
                <button id="mode-hazard-btn" class="btn-hazard">Hazard</button>
                <button id="mode-danger-btn" class="btn-danger">Danger</button>
            </div>
            <div id="session-buttons">
                <button id="start-race-btn" class="btn-primary">Start Race</button>
                <button id="mode-finish-btn" class="btn-primary">Finish</button>
                <button id="end-session-btn" class="btn-primary">End Session</button>
            </div>
        </div>
    </div>
    
    <div id="auth-overlay">
        <div class="login-box">
            <h2>Employee Access</h2>
            <p class="login-subtitle">Enter your access key to continue</p>
            <form>
                <input type="password" id="access-key" placeholder="Access key">
                <button type="submit" class="btn-primary">Unlock</button>
                <p id="auth-error" class="error-text"></p>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/socket-auth.js"></script>
    <script src="/shared/race-display.js"></script>
    <script src="/employee/race-control.js"></script>
    
</body>
</html>
