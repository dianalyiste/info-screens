<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leader Board</title>
    <link rel="stylesheet" href="../displays/shared.css">
    <link rel="stylesheet" href="../displays/leader-board.css">
    <link rel="stylesheet" href="../shared/buttons.css">
</head>
<body>
<h1>Leader Board</h1>
<h1 class="align-left" id="timer-row">Time remaining: <span id="timer">--:--</span></h1>
<div class="session" id="race-status">
    <h3 id="status-text"></h3>
    <table id="results-table">
        <thead>
        <tr>
            <th>Pos</th>
            <th>Car</th>
            <th>Driver</th>
            <th>Fastest Lap</th>
            <th>Laps</th>
        </tr>
        </thead>
        <tbody id="rows">
        </tbody>
    </table>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="../displays/shared.js"></script>
<script src="../displays/leader-board.js"></script>
</body>
</html>
